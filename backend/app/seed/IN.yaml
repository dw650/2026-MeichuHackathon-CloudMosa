# India seed data (docs/06 §1.6, §7). Areas are the districts of Maharashtra, Karnataka and NCT of
# Delhi where at least one market reported one of these crops to Agmarknet between 23 July and
# 19 September 2026; markets are every such market. Centres are the districts' OpenStreetMap
# centres (Nominatim, 2026-09-20); Delhi is the whole NCT. Names stay in English.
# The worker syncs everything except the `mock` blocks into the database; the mock provider
# reads `mock` directly. Mock prices are in the source's unit: ₹ per quintal (100 kg).
#   k:   price level factor (area: its September median ÷ the three states', Nashik = 1;
#        market: its median ÷ its district's)
#   lag: days behind today for the latest data (0 = today, null = no data at all)
#   p / lo / hi: today's base price and range; chg: change vs previous trading day
#   arr: today's arrivals (tonnes); arrR: today ÷ average of the previous 7 trading days
#   rt: retail factor (null = no retail data for this crop). Agmarknet has no retail prices:
#       only the demo has them.

country:
  code: IN
  sort: 1
  name: { zh-TW: 印度, en: India }
  coverage: { zh-TW: "2 個邦與德里、64 個縣", en: "2 states & Delhi, 64 districts" }
  currency: INR
  locale: en-IN
  utc_offset_min: 330
  up_is_pos: true
  closed_weekdays: [7] # Sunday (ISO weekday)
  default_area: nashik
  default_recent_areas: [nashik, pune, ahmednagar]
  area_suffix: { zh-TW: " 縣", en: " district" }
  rep_price_label: { zh-TW: 常見價, en: Modal price }
  source_label:
    zh-TW: Agmarknet（印度農業部，data.gov.in，GODL-India）
    en: Agmarknet (Govt of India, data.gov.in, GODL-India)
  units:
    wholesale:
      default: qtl
      options:
        - { id: qtl, per_kg: 100, decimals: 0, label: { zh-TW: ₹/100公斤, en: ₹/qtl } }
        - { id: kg, per_kg: 1, decimals: 1, label: { zh-TW: ₹/公斤, en: ₹/kg } }
    retail:
      default: kg
      options:
        - { id: kg, per_kg: 1, decimals: 1, label: { zh-TW: ₹/公斤, en: ₹/kg } }
        - { id: qtl, per_kg: 100, decimals: 0, label: { zh-TW: ₹/100公斤, en: ₹/qtl } }

