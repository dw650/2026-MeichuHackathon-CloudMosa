# Taiwan seed data (docs/06 §7.2–§7.3). Areas, markets and crops follow the real MOA
# FarmTransData (2026-07-23 to 09-20): every county or city with a fruit and vegetable
# wholesale market, every such market, and the crops traded on most days in most areas.
# The worker syncs everything except the `mock` blocks into the database; the mock provider
# reads `mock` directly. Mock prices are in the source's unit: NT$ per kg.
#   k:   price level factor (area or market)
#   lag: days behind today for the latest data (0 = today, null = no data at all)
#   p / lo / hi: today's base price and range, the medians of 平均價 / 下價 / 上價 over the
#        60 days (every market); chg: change vs previous trading day
#   arr: today's volume (kg, the median 交易量 of a market and day);
#        arrR: today ÷ average of the previous 7 trading days
#   rt: retail factor (null = no retail data for this crop)

country:
  code: TW
  sort: 2
  name: { zh-TW: 台灣, en: Taiwan }
  coverage: { zh-TW: 13 個縣市, en: 13 cities/counties }
  currency: TWD
  locale: zh-TW
  utc_offset_min: 480
  up_is_pos: false
  closed_weekdays: [1] # Monday (ISO weekday)
  default_area: taipei
  default_recent_areas: [taipei, newtaipei, taichung]
  area_suffix: { zh-TW: "", en: "" }
  rep_price_label: { zh-TW: 平均價, en: Average price }
  source_label: { zh-TW: 農業部 農產品交易行情, en: MOA wholesale prices (Govt) }
  units:
    wholesale:
      default: kg
      options:
        - { id: kg, per_kg: 1, decimals: 1, label: { zh-TW: 元/公斤, en: NT$/kg } }
        - { id: catty, per_kg: 0.6, decimals: 1, label: { zh-TW: 元/台斤, en: NT$/catty } }
    retail:
      default: kg
      options:
        - { id: kg, per_kg: 1, decimals: 1, label: { zh-TW: 元/公斤, en: NT$/kg } }
        - { id: catty, per_kg: 0.6, decimals: 1, label: { zh-TW: 元/台斤, en: NT$/catty } }
  # Fruit and vegetable market groups for the home grid (crops use the ids).
  categories:
    - { id: leafy, name: { zh-TW: 葉菜類, en: Leafy }, icon: cabbage, tone: green }
    - { id: root, name: { zh-TW: 根莖類, en: Roots }, icon: sweetpotato, tone: amber }
    - { id: gourd, name: { zh-TW: 瓜類, en: Gourds }, icon: loofah, tone: olive }
    - { id: fruitveg, name: { zh-TW: 花果菜類, en: Veg }, icon: eggplant, tone: yellow }
    - { id: spice, name: { zh-TW: 辛香料, en: Spices }, icon: chilli, tone: red }
    - { id: fruit, name: { zh-TW: 水果, en: Fruit }, icon: pineapple, tone: orange }

