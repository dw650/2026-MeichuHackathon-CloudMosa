# Source name → our id. The mock provider speaks the MOA FarmTransData format
# (作物名稱 "甘藍-初秋", 市場名稱, 民國日期) for wholesale and a 物價查報-like format (縣市)
# for retail. Empty variety = any.
source_maps:
  mock:
    crops:
      - { source_name: 甘藍, crop: cabbage }
      - { source_name: 小白菜, crop: bokchoy }
      - { source_name: 香蕉, crop: banana }
      - { source_name: 甘藷, crop: sweetpotato }
      - { source_name: 青蔥, crop: scallion }
      - { source_name: 番茄, crop: tomato }
      - { source_name: 芒果, crop: mango }
      - { source_name: 鳳梨, crop: pineapple }
      - { source_name: 花椰菜, crop: cauliflower }
