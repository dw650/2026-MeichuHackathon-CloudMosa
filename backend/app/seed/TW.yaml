      - { source_name: 玉米, crop: maize }
      - { source_name: 稻米, crop: rice }
      - { source_name: 番石榴, crop: guava }
      - { source_name: 毛豆, crop: soybean }
      - { source_name: 紅豆, crop: adzuki }
      - { source_name: 蒜頭, crop: garlic }
      - { source_name: 辣椒, crop: chilli }
