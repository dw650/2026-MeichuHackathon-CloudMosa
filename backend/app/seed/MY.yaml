# PriceCatcher codes → our ids (quoted: the codes are strings). Items are matched exactly by
# item_code; every mapped item is sold per kg (tests check the lookup). Wholesale markets are the
# "Borong" premises; retail points are the wet markets ("Pasar Basah") of each area, and an area's
# retail price is their median. Mini markets, supermarkets and restaurants are left out.
source_maps:
  mock:
    crops: &pricecatcher_items
      - { source_name: "114", crop: tomato } # TOMATO
      - { source_name: "1458", crop: cabbage } # KUBIS BULAT IMPORT (BEIJING)
      - { source_name: "92", crop: chilli } # CILI HIJAU
      - { source_name: "129", crop: onion } # BAWANG BESAR KUNING/HOLLAND
      - { source_name: "113", crop: cucumber } # TIMUN
      - { source_name: "2086", crop: bokchoy } # SAWI PENDEK/JEPUN/SIOW PAK CHOY
      - { source_name: "1564", crop: garlic } # BAWANG PUTIH IMPORT (CHINA)
      - { source_name: "95", crop: ginger } # HALIA BASAH (TUA)
      - { source_name: "109", crop: carrot } # LOBAK MERAH
      - { source_name: "1481", crop: cauliflower } # KUBIS BUNGA (CAULIFLOWER)
      - { source_name: "1559", crop: waterspinach } # KANGKUNG
      - { source_name: "1131", crop: potato } # UBI KENTANG IMPORT (CHINA)
      - { source_name: "98", crop: longbean } # KACANG PANJANG
      - { source_name: "97", crop: frenchbean } # KACANG BUNCIS
      - { source_name: "108", crop: turmeric } # KUNYIT HIDUP
      - { source_name: "1132", crop: lime } # LIMAU NIPIS
      - { source_name: "1928", crop: calamansi } # LIMAU KASTURI
      - { source_name: "368", crop: peanut } # KACANG TANAH (IMPORT)
      - { source_name: "102", crop: coconut } # KELAPA PARUT (BIASA)
      - { source_name: "917", crop: wheat } # TEPUNG GANDUM NGP (BERBUNGKUS, CAP SAUH)
    markets: &borong_premises
      - { source_market: "18147", market: klborong } # Pasar Borong Kuala Lumpur
      - { source_market: "18143", market: klangborong } # Pasar Borong Klang
      - { source_market: "18151", market: jbborong } # Pasar Borong Pandan Kangkar Tebrau
