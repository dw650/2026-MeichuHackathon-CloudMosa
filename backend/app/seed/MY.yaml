# Malaysia seed data (docs/06 §1.5, §7). Areas are districts (Kuala Lumpur and Putrajaya: the
# whole federal territory); names stay in English, as in India. Prices come from KPDN PriceCatcher
# (data.gov.my, CC BY 4.0), which reports one price per premise, item and day.
# The worker syncs everything except the `mock` blocks into the database; the mock provider
# reads `mock` directly. Mock prices are in the source's unit: RM per kg.
#   k:   price level factor (area or market)
#   lag: days behind today for the latest data (0 = today, null = no data at all)
#   p:   today's wholesale base price; chg: change vs previous trading day
#   rt:  retail factor. PriceCatcher has one price per premise and no volumes, so the mock
#        leaves out lo/hi (day range) and arr/arrR (arrivals) for Malaysia.

country:
  code: MY
  sort: 3
  name: { zh-TW: 馬來西亞, en: Malaysia }
  coverage: { zh-TW: 15 個州與直轄區、75 個縣, en: "15 states & FTs, 75 districts" }
  currency: MYR
  locale: en-MY
  utc_offset_min: 480
  up_is_pos: true # Bursa Malaysia: rises are green
  closed_weekdays: [] # prices are reported every day; public holidays simply have no rows
  default_area: kualalumpur
  default_recent_areas: [kualalumpur, klang, seremban]
  # PriceCatcher has retail prices only (the wholesale markets stopped reporting in 2026), so
  # new users start on retail; `*` still switches to wholesale.
  default_price_type: retail
  area_suffix: { zh-TW: "", en: "" }
  rep_price_label: { zh-TW: 查報價, en: Reported price }
  source_label:
    zh-TW: KPDN PriceCatcher（data.gov.my，CC BY 4.0）
    en: KPDN PriceCatcher (data.gov.my, CC BY 4.0)
  units:
    wholesale:
      default: kg
      options:
        - { id: kg, per_kg: 1, decimals: 2, label: { zh-TW: RM/公斤, en: RM/kg } }
        - { id: kati, per_kg: 0.605, decimals: 2, label: { zh-TW: RM/斤, en: RM/kati } }
    retail:
      default: kg
      options:
        - { id: kg, per_kg: 1, decimals: 2, label: { zh-TW: RM/公斤, en: RM/kg } }
        - { id: kati, per_kg: 0.605, decimals: 2, label: { zh-TW: RM/斤, en: RM/kati } }

# Every district where at least two wet markets reported on more than half of the days with
# data in the last 60 (checked on 2026-09-20 against PriceCatcher, docs/06 §1.5): 75 districts
# in 13 states and 2 federal territories, each a whole territory. Names are the lookup's
# district names. The first 11 came first; the others follow by state. Coordinates of the added
# ones are the district's main town, or the district's point where no town has its name, from
# OpenStreetMap (Nominatim, © OpenStreetMap contributors, ODbL). Mock k: the district's median
# price over the national median of the districts, per crop and day, in Jul–Sep 2026. Seven
# districts have a wholesale market ("Borong" premise); retail points are the wet markets
# (see source_maps.my_pricecatcher).
