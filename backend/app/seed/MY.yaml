# Malaysia seed data (docs/06 §1.5, §7). Areas are districts (Kuala Lumpur: the whole federal
# territory); names stay in English, as in India. Prices come from KPDN PriceCatcher
# (data.gov.my, CC BY 4.0), which reports one price per premise, item and day.
# The worker syncs everything except the `mock` blocks into the database; the mock provider
# reads `mock` directly. Mock prices are in the source's unit: RM per kg.
#   k:   price level factor (area or market)
#   lag: days behind today for the latest data (0 = today, null = no data at all)
#   p:   today's wholesale base price; chg: change vs previous trading day
#   rt:  retail factor. PriceCatcher has one price per premise and no volumes, so the mock
#        leaves out lo/hi (day range) and arr/arrR (arrivals) for Malaysia.

country:
  code: MY
  sort: 3
  name: { zh-TW: 馬來西亞, en: Malaysia }
  coverage: { zh-TW: 11 個州與直轄區, en: 11 states & territories }
  currency: MYR
  locale: en-MY
  utc_offset_min: 480
  up_is_pos: true # Bursa Malaysia: rises are green
  closed_weekdays: [] # prices are reported every day; public holidays simply have no rows
  default_area: kualalumpur
  default_recent_areas: [kualalumpur, klang, seremban]
  area_suffix: { zh-TW: "", en: "" }
  rep_price_label: { zh-TW: 查報價, en: Reported price }
  source_label:
    zh-TW: KPDN PriceCatcher（data.gov.my，CC BY 4.0）
    en: KPDN PriceCatcher (data.gov.my, CC BY 4.0)
  units:
    wholesale:
      default: kg
      options:
        - { id: kg, per_kg: 1, decimals: 2, label: { zh-TW: RM/公斤, en: RM/kg } }
        - { id: kati, per_kg: 0.605, decimals: 2, label: { zh-TW: RM/斤, en: RM/kati } }
    retail:
      default: kg
      options:
        - { id: kg, per_kg: 1, decimals: 2, label: { zh-TW: RM/公斤, en: RM/kg } }
        - { id: kati, per_kg: 0.605, decimals: 2, label: { zh-TW: RM/斤, en: RM/kati } }

