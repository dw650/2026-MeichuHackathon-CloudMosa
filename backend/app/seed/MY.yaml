# PriceCatcher codes → our ids (quoted: the codes are strings). Items are matched exactly by
# item_code; every mapped item is sold per kg (tests check the lookup). Wholesale markets are the
# "Borong" premises; retail points are the wet markets ("Pasar Basah") of each area, and an area's
# retail price is their median. Mini markets, supermarkets and restaurants are left out.
