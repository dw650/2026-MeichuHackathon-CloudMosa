# Demo news (NEWS_SOURCE=demo): fixed items for the e2e checks and screenshots, so they need
# no network. They go through the same pipeline as real headlines. The publisher is always
# 示範資料 / Demo data, and switching back to NEWS_SOURCE=google removes them.
#   hours_ago: published this many hours before the run
#   summary: optional (items without one show the title only, like real items); written in
#          the country's summary language (sources.yaml: TW zh-TW, IN hi, MY ms)
#   crops: optional extra crop tags, as a summariser would add them
