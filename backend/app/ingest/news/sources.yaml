# News searches per country for the 新聞 page (docs/06 §1.6). Countries listed here but not in
# the seed (app/seed/*.yaml) are skipped until their seed exists.
#   summary_lang: language the summaries are written in: the country's own language
#          (TW zh-TW, IN hi, MY ms), whatever the reader's interface language is
#   feeds: Google News RSS editions (hl, gl, ceid) and the searches run in each; the worker
#          adds "when:7d" on a country's first run and "when:2d" afterwards
#   keywords: price news on their own (菜價, mandi prices); a headline with one is kept
#   topics / price_words: otherwise a headline needs a crop or a topic word AND a price word
#          (「果菜市場發加倍券」 has a topic but no price word, so it is left out)
#   exclude: headlines with one of these are left out: another country's market report
#          (印度, mandi price, ringgit) or something else that reads like price news (車價)
#   exclude_sources: publishers never kept, whatever they write: a foreign site that
#          translates another country's market reports into the local language (vietnam.vn)
#          or publishes every country's wholesale report (indexbox.io). An entry matches the
#          domain and its subdomains, or the publisher name as a whole word; a leading dot is
#          a whole top-level domain (".in" is every Indian publisher)
#   query_exclude: negative terms added to every search, the way "when:Nd" is. Google News
#          honours plain words and matches them against the whole article, so the answer has
#          fewer foreign items to begin with; "site:" and "source:" do not work there. Each
#          term also costs a little recall, so the list stays short and the filters above
#          stay the layer we rely on
#   confusable: longer phrases that contain a crop name but are not that crop
#          (香蕉葡萄 is a Korean grape, kelapa sawit is oil palm); a crop matched inside one
#          of them does not count. Crop names inside other crop names (薜 in 薜黃, kubis in
#          kubis bunga) need no entry: the longer term always wins
#   crop_aliases / area_aliases: other names used in headlines, on top of every name in the
#          seed (all languages); unknown ids are ignored
countries:
  TW:
    summary_lang: zh-TW
    feeds:
      - hl: zh-TW
        gl: TW
        ceid: "TW:zh-Hant"
        queries: [菜價, 蔬菜 批發價, 蔬菜價格, 果菜市場, 水果價格]
    keywords: [菜價, 批發價, 產地價, 拍賣價, 果菜價, 蔬菜價格, 水果價格, 農產品價格]
    topics: [蔬菜, 蔬果, 果菜, 青菜, 葉菜, 水果, 農產品, 菜農, 果農, 農損]
    price_words: [價, 漲, 跌, 貴, 便宜]
    # 中國 is not here on purpose: 中國時報 is a Taiwanese paper. 日本 neither: Taiwan's own
    # export news names it.
    exclude: [裝運點, 終端市場, 美股, 印度, 越南, 泰國, 印尼, 韓國, 馬來西亞, 菲律賓, 盧比, 令吉, 泰銖, ₹]
    exclude_sources: [vietnam.vn, indexbox.io]
    query_exclude: [越南]
    confusable: [香蕉葡萄]  # a Korean grape variety, not 香蕉
    crop_aliases:
      cabbage: [高麗菜]
      sweetpotato: [地瓜, 番薯]
      scallion: [三星蔥]
      waterspinach: [蕹菜]
      napacabbage: [大白菜, 結球白菜]
      cucumber: [花胡瓜]
      greenpepper: [青椒]
      dragonfruit: [火龍果]
      guava: [番石榴]
      garlic: [大蒜]
    area_aliases:
      # Wholesale markets and companies named in headlines.
      taipei: [北農]
      newtaipei: [板橋果菜]
      taichung: [豐原]
      yunlin: [西螺]
      kaohsiung: [鳳山]

  IN:
    summary_lang: hi
    feeds:
      - hl: en-IN
        gl: IN
        ceid: "IN:en"
        queries:
          - mandi prices
          - onion prices India
          - tomato prices India
          - vegetable prices India
          - APMC prices
    keywords:
      - mandi price
      - mandi rate
      - mandi arrival
      - apmc
      - agmarknet
      - vegetable price
      - vegetables price
      - fruit price
      - food inflation
      - msp
    topics: [vegetable, fruit, farmer, crop, kharif, rabi, agriculture, farm produce]
    price_words:
      - price
      - rate
      - cost
      - costlier
      - cheaper
      - dearer
      - inflation
      - hike
      - slump
      - surge
      - soar
      - crash
      - rs
      - ₹
      - kg
      - quintal
    # Only the other countries' market words, not their names: India's own market stories name
    # them (onion exports to Bangladesh, palm oil from Malaysia, rice against Vietnam).
    exclude: [usda, terminal market, shipping point, on road price, pakistan, harga, pasar borong, ringgit, rupiah]
    exclude_sources: [vietnam.vn, indexbox.io]
    query_exclude: [harga, ringgit, rupiah]
    crop_aliases:
      chilli: [chili, green chilli]
      soybean: [soya, soyabean]
      maize: [corn]
      grapes: [grape]
      rice: [paddy]
      eggplant: [eggplant]
      chickpea: [chana]
      turmeric: [haldi]
      peanut: [peanut]
      sugarcane: [sugar cane]
    area_aliases:
      nashik: [Lasalgaon, Pimpalgaon]
      pune: [Poona]
      ahmednagar: [Ahilyanagar]
      solapur: [Sholapur]
      bengaluru: [Bengaluru, Bangalore]
      delhi: [Delhi, Azadpur]

  # Malaysia: English and Malay editions; the seed names crops in English, so the Malay names
  # headlines use are aliases here.
  MY:
    summary_lang: ms
    feeds:
      - hl: en-MY
        gl: MY
        ceid: "MY:en"
        queries: [vegetable prices Malaysia, vegetable price hike Malaysia]
      - hl: ms-MY
        gl: MY
        ceid: "MY:ms"
        queries: [harga sayur, pasar borong sayur]
    keywords: [harga sayur, vegetable price, vegetables price, fruit price]
    topics: [sayur, sayur-sayuran, buah, buah-buahan, petani, fama, pasar borong, vegetable, fruit, farmer]
    price_words: [harga, naik, turun, mahal, murah, price, rate, cost, rm, kg]
    # India's market words and names. "mandi" alone is not here: it is Malay for "to bathe".
    # "indian" neither: ikan kembung is the Indian mackerel of every wet-market price story.
    exclude: [usda, terminal market, shipping point, india, vietnam, indonesia, mandi price, mandi rate, apmc, agmarknet, quintal, rupee, lakh, crore, rupiah, ₹]
    exclude_sources: [vietnam.vn, indexbox.io, .in]
    query_exclude: [vietnam]
    confusable: [kelapa sawit, minyak sawit]  # oil palm, not the coconut alias kelapa
    crop_aliases:
      cabbage: [kubis]
      chilli: [cili, chili]
      onion: [bawang besar]
      cucumber: [timun]
      bokchoy: [sawi]
      garlic: [bawang putih]
      ginger: [halia]
      carrot: [lobak merah]
      cauliflower: [kubis bunga]
      waterspinach: [kangkung]
      potato: [kentang]
      longbean: [kacang panjang]
      frenchbean: [kacang buncis, buncis]
      turmeric: [kunyit]
      lime: [limau nipis]
      calamansi: [limau kasturi]
      peanut: [kacang tanah]
      coconut: [kelapa]
      wheat: [tepung gandum]
    area_aliases:
      # Headlines usually name the state: every district of a state (MY.yaml) takes its
      # name, so state news comes first in each of them. Area names match by themselves.
      kualalumpur: [KL, Selayang]
      klang: [Selangor]
      gombak: [Selangor]
      hululangat: [Selangor]
      huluselangor: [Selangor]
      kualaselangor: [Selangor]
