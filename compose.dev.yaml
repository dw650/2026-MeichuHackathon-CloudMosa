# Development overrides (`make dev`): Vite HMR behind Caddy, api with --reload, bind mounts.
#   docker compose -f compose.yaml -f compose.dev.yaml up -d
services:
  api:
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn --factory app.main:create_app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    environment:
      DEMO_MODE: "true"
    volumes:
      - ./backend/app:/app/app:ro

  frontend-dev:
    image: node:24-slim
    working_dir: /app
    # Reinstall only when package-lock.json changes, then serve with HMR.
    command:
      - sh
      - -c
      - >-
        h=$$(sha256sum package-lock.json);
        [ "$$h" = "$$(cat node_modules/.lockhash 2>/dev/null)" ] ||
        { npm ci --no-audit --no-fund && echo "$$h" > node_modules/.lockhash; };
        exec npx vite --host 0.0.0.0 --port 5173
    environment:
      VITE_DEMO: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 180s

  web:
    image: caddy:2
    build: !reset null
    volumes:
      - ./infra/caddy/Caddyfile.dev:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      frontend-dev:
        condition: service_healthy

volumes:
  frontend_node_modules:
