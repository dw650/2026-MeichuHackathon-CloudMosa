<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="title">AgriPrice 系統架構與資料流程</title><desc id="description">按鍵手機透過 CloudMosa 雲端 Chromium 執行 React。Caddy 轉發請求至 FastAPI，後者查詢 PostgreSQL。Worker 抓取台灣、印度、馬來西亞行情、世界銀行月資料、匯率與新聞，整理後寫入資料庫。Gemini 處理新聞摘要與作物標註。</desc><defs><marker id="blue" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,-4 L9,0 L0,4 Z" fill="#2969A7"/></marker><marker id="orange" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,-4 L9,0 L0,4 Z" fill="#B66A1D"/></marker><marker id="purple" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,-4 L9,0 L0,4 Z" fill="#8154AE"/></marker><marker id="grey" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="12" markerHeight="12" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,-4 L9,0 L0,4 Z" fill="#7A8F82"/></marker></defs><style>text { font-family: "Noto Sans CJK TC", "Microsoft JhengHei", "PingFang TC", sans-serif; }</style><rect x="0" y="0" width="1920" height="1080" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1.5"/>
