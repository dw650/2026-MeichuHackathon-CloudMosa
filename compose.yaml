# All services for local runs and production. The project name follows the
# folder name on purpose, so two worktrees can run their own stacks.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agri}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agri-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-agri}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Local tests only; never exposed beyond this machine.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-agri}:${POSTGRES_PASSWORD:-agri-local-only}@db:5432/${POSTGRES_DB:-agri}}
      DEMO_MODE: ${DEMO_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/data/geoip/city.mmdb}
      # The running commit for /api/v1/health and the About page (make up, scripts/deploy.sh).
      APP_VERSION: ${APP_VERSION:-dev}
    volumes:
      # Optional IP database for /locate (see infra/geoip/README.md); never in Git.
      - ./infra/geoip:/data/geoip:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-agri}:${POSTGRES_PASSWORD:-agri-local-only}@db:5432/${POSTGRES_DB:-agri}}
      PROVIDERS: ${PROVIDERS:-mock}
      # International reference prices (bonus B5): downloaded only when due (docs/06 §8).
      INTL_PRICES: ${INTL_PRICES:-true}
      PINK_SHEET_URL: ${PINK_SHEET_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # News (docs/06 §1.6): google, demo (fixed items, no network) or off. Summaries need
      # GEMINI_API_KEY or a self-hosted OpenAI-compatible model (SUMMARY_API_BASE, SUMMARY_MODEL).
      NEWS_SOURCE: ${NEWS_SOURCE:-google}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      SUMMARY_API_BASE: ${SUMMARY_API_BASE:-}
      SUMMARY_MODEL: ${SUMMARY_MODEL:-}
      SUMMARY_API_KEY: ${SUMMARY_API_KEY:-}
    extra_hosts:
      # Lets SUMMARY_API_BASE reach a model tunnelled to this host (host.docker.internal).
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      # The api runs the migrations before it reports healthy.
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_DEMO: ${VITE_DEMO:-false}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Caddy's admin endpoint answers on localhost inside the container whatever SITE_ADDRESS is.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  db_data:
  caddy_data:
  caddy_config:
