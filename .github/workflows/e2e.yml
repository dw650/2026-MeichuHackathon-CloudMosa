# Playwright UI checks (docs/07 §4): only on demand and on main, never on every push.
name: E2E

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (npm ci)
        run: make frontend/node_modules/.package-lock.json
      - name: Install Chromium with its system dependencies
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Full stack in demo mode + Playwright (JSON summary)
        run: make e2e
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: frontend/e2e/artifacts
          retention-days: 7
