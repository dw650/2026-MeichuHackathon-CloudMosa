# CD (docs/07 §5.3): when CI passes on main, marks that commit as ready by moving the `deploy`
# branch to it. GitHub cannot reach the server (its firewall only lets some networks in), so the
# server checks the branch every minute and deploys new commits itself (scripts/deploy-poll.sh).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy (a rollback is a deploy of an older commit)
        default: main

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  mark:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REF: ${{ github.event.workflow_run.head_sha || inputs.ref }}
      APP_URL: ${{ vars.DEPLOY_URL || 'http://203.116.30.131:3001' }}
    steps:
      - name: Move the deploy branch
        run: |
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/deploy" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/deploy" \
              -f sha="$sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref=refs/heads/deploy -f sha="$sha" >/dev/null
          fi
          echo "Marked \`${sha:0:7}\` for deployment. The server picks it up within a minute and" \
            "needs a few more to build: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
